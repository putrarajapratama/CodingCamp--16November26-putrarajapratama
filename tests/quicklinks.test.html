<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickLinks Property Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 2rem; max-width: 800px; margin: 0 auto; }
    h1   { font-size: 1.4rem; margin-bottom: 1.5rem; }
    .suite { margin-bottom: 2rem; }
    .suite h2 { font-size: 1rem; color: #aaa; margin-bottom: 0.5rem; border-bottom: 1px solid #333; padding-bottom: 0.25rem; }
    .result { padding: 0.5rem 0.75rem; border-radius: 4px; margin: 0.4rem 0; font-size: 0.9rem; font-family: monospace; }
    .pass { background: #1a3a1a; color: #6fcf6f; border-left: 3px solid #4caf50; }
    .fail { background: #3a1a1a; color: #f07070; border-left: 3px solid #e53935; }
    .summary { margin-top: 1.5rem; font-size: 1rem; padding: 0.75rem 1rem; border-radius: 6px; }
    .summary.all-pass { background: #1a3a1a; color: #6fcf6f; }
    .summary.has-fail  { background: #3a1a1a; color: #f07070; }
  </style>
</head>
<body>
  <h1>QuickLinks — Property Tests (Task 8.2)</h1>
  <div id="output"></div>

  <!-- fast-check UMD bundle — only loaded in this test file, never in index.html -->
  <script src="https://cdn.jsdelivr.net/npm/fast-check@3/lib/bundle/fast-check.min.js"></script>
  <script>
  (function () {
    'use strict';

    /* ─────────────────────────────────────────────
     * Helpers extracted verbatim from QuickLinks in app.js
     * (app.js auto-executes and requires the real DOM, so we
     *  replicate the pure logic here for isolated testing.)
     * ───────────────────────────────────────────── */

    function validate(label, url) {
      var tl = label ? label.trim() : '';
      var tu = url   ? url.trim()   : '';
      if (tl.length === 0)  return 'Link label cannot be empty.';
      if (tl.length > 50)   return 'Link label must be 50 characters or fewer.';
      if (tu.length === 0)  return 'Link URL cannot be empty.';
      if (tu.length > 2048) return 'Link URL must be 2048 characters or fewer.';
      if (tu.indexOf('http://') !== 0 && tu.indexOf('https://') !== 0)
        return 'URL must start with "http://" or "https://".';
      return null;
    }

    function genId() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
        return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    /* Minimal QuickLinks stand-in for _add logic */
    function makeQuickLinks(initialLinks) {
      var links = initialLinks ? initialLinks.slice() : [];
      return {
        links: links,
        add: function (label, url) {
          if (links.length >= 20)
            return 'Maximum 20 links reached. Remove one before adding more.';
          links.push({ id: genId(), label: label.trim(), url: url.trim() });
          return null;
        }
      };
    }

    /* ─────────────────────────────────────────────
     * Arbitraries
     * ───────────────────────────────────────────── */

    // Valid label: trimmed length 1–50
    var validLabelArb = fc.string({ minLength: 1, maxLength: 50 })
      .filter(function (s) { return s.trim().length >= 1 && s.trim().length <= 50; });

    // Valid URL: http:// or https:// prefix + at least one more char, total ≤ 2048
    var validUrlArb = fc.oneof(fc.constant('http://'), fc.constant('https://'))
      .chain(function (prefix) {
        return fc.string({ minLength: 1, maxLength: 2048 - prefix.length })
          .map(function (s) { return prefix + s; });
      });

    // A single valid link object (for seeding the 20-link array)
    var validLinkObjArb = fc.tuple(validLabelArb, validUrlArb).map(function (t) {
      return { id: genId(), label: t[0].trim(), url: t[1].trim() };
    });

    /* ─────────────────────────────────────────────
     * Test runner helpers
     * ───────────────────────────────────────────── */
    var passed = 0;
    var failed = 0;

    var outputEl = document.getElementById('output');

    function currentSuite(title) {
      var div = document.createElement('div');
      div.className = 'suite';
      var h2 = document.createElement('h2');
      h2.textContent = title;
      div.appendChild(h2);
      outputEl.appendChild(div);
      return div;
    }

    function logResult(suiteEl, ok, label, detail) {
      var el = document.createElement('div');
      el.className = 'result ' + (ok ? 'pass' : 'fail');
      el.textContent = (ok ? '✓ ' : '✗ ') + label + (detail ? ' — ' + detail : '');
      suiteEl.appendChild(el);
      if (ok) passed++; else failed++;
    }

    function runProperty(suiteEl, name, prop) {
      try {
        fc.assert(prop, { numRuns: 1000 });
        logResult(suiteEl, true, name);
      } catch (e) {
        logResult(suiteEl, false, name, e.message.split('\n')[0]);
      }
    }

    /* ─────────────────────────────────────────────
     * Property 8 — Link validation covers all invalid inputs
     * Req 4.2, 4.3
     * ───────────────────────────────────────────── */
    var suite8 = currentSuite('Property 8 — Link validation (Req 4.2, 4.3)');

    // 8a: if validate returns null, all individual rules must pass
    runProperty(suite8,
      '8a — validate(label, url) === null implies all rules satisfied',
      fc.property(fc.string(), fc.string(), function (label, url) {
        var tl = label ? label.trim() : '';
        var tu = url   ? url.trim()   : '';
        var result = validate(label, url);
        if (result === null) {
          return (
            tl.length >= 1 &&
            tl.length <= 50 &&
            tu.length >= 1 &&
            tu.length <= 2048 &&
            (tu.indexOf('http://') === 0 || tu.indexOf('https://') === 0)
          );
        }
        // non-null result is always acceptable for any input
        return true;
      })
    );

    // 8b: empty label always rejected
    runProperty(suite8,
      '8b — empty label (after trim) always returns an error',
      fc.property(
        fc.stringOf(fc.constantFrom(' ', '\t', '\r', '\n'), { minLength: 0, maxLength: 20 }),
        fc.string(),
        function (emptyLabel, url) {
          return validate(emptyLabel, url) !== null;
        }
      )
    );

    // 8c: label > 50 chars always rejected
    runProperty(suite8,
      '8c — label trimmed length > 50 always returns an error',
      fc.property(
        fc.string({ minLength: 51, maxLength: 200 })
          .filter(function (s) { return s.trim().length > 50; }),
        fc.string(),
        function (longLabel, url) {
          return validate(longLabel, url) !== null;
        }
      )
    );

    // 8d: empty URL always rejected (given valid label)
    runProperty(suite8,
      '8d — empty URL (after trim) always returns an error',
      fc.property(
        validLabelArb,
        fc.stringOf(fc.constantFrom(' ', '\t', '\r', '\n'), { minLength: 0, maxLength: 20 }),
        function (label, emptyUrl) {
          return validate(label, emptyUrl) !== null;
        }
      )
    );

    // 8e: URL > 2048 chars always rejected (given valid label)
    runProperty(suite8,
      '8e — URL trimmed length > 2048 always returns an error',
      fc.property(
        validLabelArb,
        fc.string({ minLength: 2049, maxLength: 2200 })
          .filter(function (s) { return s.trim().length > 2048; }),
        function (label, longUrl) {
          return validate(label, longUrl) !== null;
        }
      )
    );

    // 8f: URL with wrong scheme always rejected (given valid label)
    runProperty(suite8,
      '8f — URL not starting with http:// or https:// always returns an error',
      fc.property(
        validLabelArb,
        fc.string({ minLength: 1, maxLength: 100 })
          .filter(function (s) {
            var t = s.trim();
            return t.length >= 1 && t.indexOf('http://') !== 0 && t.indexOf('https://') !== 0;
          }),
        function (label, badUrl) {
          return validate(label, badUrl) !== null;
        }
      )
    );

    /* ─────────────────────────────────────────────
     * Property 9 — Link addition round-trip
     * Req 4.1, 4.5
     * ───────────────────────────────────────────── */
    var suite9 = currentSuite('Property 9 — Link addition round-trip (Req 4.1, 4.5)');

    runProperty(suite9,
      '9a — adding a valid link succeeds (_add returns null)',
      fc.property(validLabelArb, validUrlArb, function (label, url) {
        var ql = makeQuickLinks([]);
        return ql.add(label, url) === null;
      })
    );

    runProperty(suite9,
      '9b — added link appears in the list with trimmed label and url',
      fc.property(validLabelArb, validUrlArb, function (label, url) {
        var ql = makeQuickLinks([]);
        ql.add(label, url);
        var added = ql.links[0];
        return (
          added !== undefined &&
          added.label === label.trim() &&
          added.url   === url.trim()
        );
      })
    );

    runProperty(suite9,
      '9c — link count increases by exactly 1 after a successful add',
      fc.property(
        fc.array(validLinkObjArb, { minLength: 0, maxLength: 19 }),
        validLabelArb,
        validUrlArb,
        function (existing, label, url) {
          var ql = makeQuickLinks(existing);
          var before = ql.links.length;
          var err = ql.add(label, url);
          return err === null && ql.links.length === before + 1;
        }
      )
    );

    runProperty(suite9,
      '9d — validate returns null for every valid (label, url) pair',
      fc.property(validLabelArb, validUrlArb, function (label, url) {
        return validate(label, url) === null;
      })
    );

    /* ─────────────────────────────────────────────
     * Property 10 — Link count cap enforcement
     * Req 4.4
     * ───────────────────────────────────────────── */
    var suite10 = currentSuite('Property 10 — Link count cap (Req 4.4)');

    runProperty(suite10,
      '10a — adding a link when 20 already exist returns the cap error',
      fc.property(
        fc.array(validLinkObjArb, { minLength: 20, maxLength: 20 }),
        validLabelArb,
        validUrlArb,
        function (full, label, url) {
          var ql = makeQuickLinks(full);
          var err = ql.add(label, url);
          return err === 'Maximum 20 links reached. Remove one before adding more.';
        }
      )
    );

    runProperty(suite10,
      '10b — adding a link when 20 already exist does not change the list',
      fc.property(
        fc.array(validLinkObjArb, { minLength: 20, maxLength: 20 }),
        validLabelArb,
        validUrlArb,
        function (full, label, url) {
          var ql = makeQuickLinks(full);
          ql.add(label, url);
          return ql.links.length === 20;
        }
      )
    );

    runProperty(suite10,
      '10c — adding a link when < 20 exist never triggers cap error',
      fc.property(
        fc.array(validLinkObjArb, { minLength: 0, maxLength: 19 }),
        validLabelArb,
        validUrlArb,
        function (partial, label, url) {
          var ql = makeQuickLinks(partial);
          var err = ql.add(label, url);
          return err !== 'Maximum 20 links reached. Remove one before adding more.';
        }
      )
    );

    /* ─────────────────────────────────────────────
     * Summary
     * ───────────────────────────────────────────── */
    var summary = document.createElement('div');
    summary.className = 'summary ' + (failed === 0 ? 'all-pass' : 'has-fail');
    summary.textContent = failed === 0
      ? '✓ All ' + passed + ' properties passed.'
      : '✗ ' + failed + ' propert' + (failed === 1 ? 'y' : 'ies') + ' failed, ' + passed + ' passed.';
    outputEl.appendChild(summary);

  })();
  </script>
</body>
</html>
